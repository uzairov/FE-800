name: Deploy Aptio

on:
  push:
    branches: [claude/talentlens-mvp-setup-OJf4X]   # поменяй на main когда смержишь
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Получить код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talentlens/package-lock.json

      # 3. Установить зависимости
      - name: Install dependencies
        working-directory: talentlens
        run: npm ci

      # 4. Собрать проект на мощном runner'е
      - name: Build
        working-directory: talentlens
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      # 5. Записать SSH-ключ во временный файл
      #    Используем env-блок чтобы сохранить переносы строк в ключе
      - name: Write SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # 6. Обновить исходники на сервере до точного SHA этого коммита
      - name: Update source code on server
        run: |
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "set -e
               cd ${{ secrets.SERVER_PATH }}
               git fetch origin
               git reset --hard ${{ github.sha }}"

      # 7. Скопировать .next/ на сервер (--delete только внутри .next/, node_modules не трогает)
      - name: Sync .next to server
        run: |
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            talentlens/.next/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/talentlens/.next/

      # 8. Установить prod-зависимости, синхронизировать схему БД, перезапустить
      #    Используем `prisma db push` (а не `migrate deploy`) — папка
      #    prisma/migrations/ в .gitignore, поэтому миграции в репозитории
      #    не хранятся. `db push` синхронизирует БД со schema.prisma напрямую.
      #    Сиды не запускаем автоматически (tsx в devDeps); запускайте вручную:
      #      cd talentlens && npm install && npm run db:seed
      - name: Deploy on server
        run: |
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "set -e
               cd ${{ secrets.SERVER_PATH }}/talentlens
               npm ci --omit=dev
               npx prisma db push --skip-generate
               pm2 restart aptio --update-env
               pm2 save"

      # 9. Удалить SSH-ключ (всегда, даже при ошибке)
      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key
