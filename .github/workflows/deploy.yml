name: Deploy Aptio

on:
  push:
    branches: [claude/talentlens-mvp-setup-OJf4X]   # поменяй на main когда смержишь
  workflow_dispatch:                                   # ручной запуск из GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Получить код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talentlens/package-lock.json

      # 3. Установить зависимости (на GitHub runner — быстро)
      - name: Install dependencies
        working-directory: talentlens
        run: npm ci

      # 4. Собрать проект (на GitHub runner — мощный, не таймаутит)
      - name: Build
        working-directory: talentlens
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      # 5. Скопировать .next/ на сервер (сервер НЕ собирает сам)
      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'talentlens/.next/'
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1   # убирает префикс talentlens/

      # 6. SSH: git pull + pm2 restart (БЕЗ сборки)
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60s
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}

            # Подтянуть новый код (без .next — он уже скопирован выше)
            git pull origin claude/talentlens-mvp-setup-OJf4X

            # Установить новые пакеты только если package.json изменился
            # (--omit=dev пропускает devDependencies, быстрее)
            npm ci --omit=dev --prefix talentlens

            # Перезапустить приложение
            pm2 restart aptio --update-env
            pm2 save
